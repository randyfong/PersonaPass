<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Website</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5f2;
      --surface: #ffffff;
      --ink: #202124;
      --muted: #646a73;
      --line: #d9d6cf;
      --accent: #246b5a;
      --accent-dark: #17483d;
      --focus: #c67b2c;
      --shadow: 0 20px 50px rgba(36, 32, 25, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(36, 107, 90, 0.09), rgba(198, 123, 44, 0.06)),
        var(--bg);
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .nav-link {
      display: inline-grid;
      min-height: 42px;
      padding: 0 16px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-weight: 800;
      text-decoration: none;
    }

    .nav-link.active,
    .nav-link:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .panel {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.25rem, 7vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf8;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input:focus,
    button:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(198, 123, 44, 0.22);
    }

    button {
      justify-self: start;
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .result {
      display: none;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .result.active {
      display: block;
    }

    .result a {
      color: var(--accent-dark);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .error {
      color: #9a3412;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 760px);
        padding: 28px 0;
      }

      .panel {
        padding: 20px;
      }

      button {
        width: 100%;
      }

    }
  </style>
</head>
<body>
  <main>
    <nav class="page-nav" aria-label="Page navigation">
      <a class="nav-link" href="../index.html">Profile</a>
      <a class="nav-link active" href="index.html" aria-current="page">Event</a>
      <a class="nav-link" href="../create/index.html">Customize</a>
    </nav>

    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">Event Input</p>
      <h1 id="page-title">Website URL</h1>
      <p>Paste the website URL for the event profile or source site.</p>

      <form id="event-form">
        <label for="website-url">Paste Website URL</label>
        <input id="website-url" name="website-url" type="url" placeholder="https://example.com" autocomplete="url" required>
        <button type="submit">Save URL</button>
      </form>

      <div id="event-result" class="result" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const eventForm = document.querySelector("#event-form");
    const websiteUrlInput = document.querySelector("#website-url");
    const eventResult = document.querySelector("#event-result");

    function normalizeUrl(value) {
      const trimmed = value.trim();
      const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
      return new URL(withProtocol);
    }

    function saveEventUrl(value, showResult = false) {
      const url = normalizeUrl(value);
      websiteUrlInput.value = url.href;
      localStorage.setItem("eventUrl", url.href);
      localStorage.setItem("eventUrlUpdatedAt", new Date().toISOString());

      if (showResult) {
        eventResult.className = "result active";
        eventResult.innerHTML = `<p>Saved event website:</p><a href="${url.href}" target="_blank" rel="noopener noreferrer">${url.href}</a>`;
      }

      return url;
    }

    function loadSavedEventUrl() {
      const savedUrl = localStorage.getItem("eventUrl");
      if (!savedUrl) {
        return;
      }

      websiteUrlInput.value = savedUrl;
    }

    eventForm.addEventListener("submit", (event) => {
      event.preventDefault();

      try {
        saveEventUrl(websiteUrlInput.value, true);
      } catch (error) {
        eventResult.className = "result active error";
        eventResult.textContent = "Enter a valid website URL.";
      }
    });

    websiteUrlInput.addEventListener("change", () => {
      try {
        saveEventUrl(websiteUrlInput.value);
      } catch (error) {
        // Keep partially typed URLs out of saved state until they are valid.
      }
    });

    loadSavedEventUrl();
  </script>
</body>
</html>
