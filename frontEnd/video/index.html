<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Event Video</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5f2;
      --surface: #ffffff;
      --ink: #202124;
      --muted: #646a73;
      --line: #d9d6cf;
      --accent: #246b5a;
      --accent-dark: #17483d;
      --focus: #c67b2c;
      --shadow: 0 20px 50px rgba(36, 32, 25, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(36, 107, 90, 0.09), rgba(198, 123, 44, 0.06)),
        var(--bg);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .nav-link {
      display: inline-grid;
      min-height: 42px;
      padding: 0 16px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-weight: 800;
      text-decoration: none;
    }

    .nav-link:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .intro {
      max-width: 760px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2.25rem, 6vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .intro p {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .video-panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .video-frame {
      overflow: hidden;
      border-radius: 8px;
      background: #101412;
      aspect-ratio: 16 / 9;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101412;
    }

    .status {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .status.error {
      color: #9a3412;
      font-weight: 800;
    }

    .status a {
      color: var(--accent-dark);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 980px);
        padding: 28px 0;
      }

      .video-panel {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="page-nav" aria-label="Page navigation">
      <a class="nav-link" href="../index.html">Profile</a>
      <a class="nav-link" href="../event/index.html">Event</a>
      <a class="nav-link" href="../create/index.html">Customize</a>
    </nav>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Generated Video</p>
      <h1 id="page-title">Event Teaser</h1>
      <p id="video-summary">Your Happy Horse event teaser is ready for review.</p>
    </section>

    <section class="video-panel" aria-label="Generated event video">
      <div class="video-frame">
        <video id="generated-video" controls playsinline muted preload="metadata"></video>
      </div>
      <p id="video-status" class="status" aria-live="polite">Loading video...</p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("videoUrl");
    const title = params.get("title");
    const status = params.get("status");
    const video = document.querySelector("#generated-video");
    const statusText = document.querySelector("#video-status");
    const pageTitle = document.querySelector("#page-title");
    const videoSummary = document.querySelector("#video-summary");

    function isAllowedVideoUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol);
      } catch (error) {
        return false;
      }
    }

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle("error", isError);
    }

    async function loadVideo() {
      if (title) {
        pageTitle.textContent = title;
      }

      if (status) {
        videoSummary.textContent = `Generation status: ${status}.`;
      }

      if (!isAllowedVideoUrl(videoUrl)) {
        setStatus("The generated video URL is missing or invalid.", true);
        video.removeAttribute("src");
        return;
      }

      video.src = videoUrl;
      video.addEventListener("loadedmetadata", () => {
        setStatus("Video loaded. Use the playback controls to pause, replay, or scrub.");
      }, { once: true });
      video.addEventListener("error", () => {
        statusText.innerHTML = `The video could not be loaded. <a href="${videoUrl}" target="_blank" rel="noopener noreferrer">Open the video directly</a>.`;
        statusText.classList.add("error");
      }, { once: true });

      try {
        await video.play();
        setStatus("Playing generated teaser.");
      } catch (error) {
        setStatus("Autoplay was blocked. Press play to review the generated teaser.");
      }
    }

    loadVideo();
  </script>
</body>
</html>
