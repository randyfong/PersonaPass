<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event User Profiler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <nav class="page-nav" aria-label="Page navigation">
      <a class="nav-link active" href="index.html" aria-current="page">Profile</a>
      <a class="nav-link" href="event/index.html">Event</a>
      <a class="nav-link" href="create/index.html">Customize</a>
    </nav>

    <section class="workspace" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">Profile Builder</p>
        <h1 id="page-title">Profile</h1>
        <p>Choose a profile type or add a short description, then review the generated profile summary.</p>
      </div>

      <section class="saved-summary" aria-label="Saved profile summary" hidden>
        <p class="eyebrow">Saved Summary</p>
        <form class="summary-editor">
          <label for="saved-summary-title">Summary Title</label>
          <input id="saved-summary-title" type="text" value="No profile saved yet">

          <label for="saved-summary-copy">Summary Text</label>
          <textarea id="saved-summary-copy" rows="4">Generate a profile, then save it to keep the selected event user summary here.</textarea>
        </form>
      </section>

      <div class="mode-tabs" role="tablist" aria-label="Input methods">
        <button class="mode-tab active" type="button" data-mode="dropdown" role="tab" aria-selected="true">Dropdown List</button>
        <button class="mode-tab" type="button" data-mode="paragraph" role="tab" aria-selected="false">Tell in one Paragraph</button>
      </div>

      <div class="content-grid">
        <section class="input-panel" aria-label="Input panel">
          <form id="dropdown-panel" class="mode-panel active">
            <label for="profile-select">Event user type</label>
            <select id="profile-select">
              <option value="Adult">Adult</option>
              <option value="Child">Child</option>
              <option value="Young Family">Young Family</option>
              <option value="Teenager">Teenager</option>
              <option value="Senior">Senior</option>
              <option value="Business Traveler">Business Traveler</option>
              <option value="Student">Student</option>
            </select>
            <button class="primary-action" type="submit">Generate Profile</button>
          </form>

          <form id="paragraph-panel" class="mode-panel">
            <label for="paragraph-input">One-paragraph description</label>
            <textarea id="paragraph-input" rows="8" maxlength="700" placeholder="Example: A busy parent planning weekend activities for two young children while balancing budget, convenience, and safety."></textarea>
            <div class="field-meta">
              <span>One paragraph only</span>
              <span id="character-count">0 / 700</span>
            </div>
            <button class="primary-action" type="submit">Analyze Text</button>
          </form>

        </section>

        <aside class="result-panel" aria-label="Profile result" hidden>
          <p class="eyebrow">Generated Profile</p>
          <form id="profile-editor" class="profile-editor">
            <label for="profile-title">Profile Type</label>
            <input id="profile-title" type="text" value="Adult">

            <label for="profile-needs">Likely Needs</label>
            <textarea id="profile-needs" rows="4">Efficiency, clear value, convenience, and practical benefits.</textarea>

            <label for="profile-tone">Recommended Tone</label>
            <textarea id="profile-tone" rows="5">Use direct, benefit-led language with enough detail to support confident decisions. Respectful, concise, and useful.</textarea>
          </form>
          <button id="save-profile" class="primary-action save-action" type="button">Save Profile</button>
        </aside>
      </div>
    </section>
  </main>

  <script src="profile/script.js"></script>
</body>
</html>
